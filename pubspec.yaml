name: safeband
description: SafeBand Flutter Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  share_plus: ^13.2.1
  pinput: ^5.0.0 
  flutter_blue_plus: ^1.35.5
  image_picker: ^1.1.2
  network_info_plus: 8.2.1
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  firebase_messaging: ^16.4.3
  intl: ^0.19.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0  
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.0
  firebase_database: ^12.0.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F7A7B"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/